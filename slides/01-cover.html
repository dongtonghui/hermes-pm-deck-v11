<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>A 方向 · 01 封面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    background: var(--tech-bg);
    color: #fff;
    overflow: hidden;
  }

  .slide-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  /* 剧场式聚光光束 */
  .spotlight {
    position: absolute;
    top: -200px;
    left: 50%;
    width: 760px;
    height: 1600px;
    transform: translateX(-50%);
    background: conic-gradient(from 180deg at 50% 0%,
      transparent 0deg,
      rgba(232,123,58,0.18) 35deg,
      rgba(255,200,120,0.28) 55deg,
      rgba(232,123,58,0.18) 75deg,
      transparent 110deg);
    filter: blur(30px);
    pointer-events: none;
    z-index: 1;
    animation: spotlight-sway 10s ease-in-out infinite;
  }

  .spotlight::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 15%, rgba(255,230,180,0.35), transparent 45%);
    mix-blend-mode: screen;
  }

  @keyframes spotlight-sway {
    0%, 100% { transform: translateX(-50%) rotate(-2deg); opacity: 0.85; }
    50% { transform: translateX(-50%) rotate(2deg); opacity: 1; }
  }

  /* 烟雾粒子层 */
  .haze {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 30%, rgba(196,92,38,0.10), transparent 40%),
      radial-gradient(circle at 30% 70%, rgba(232,123,58,0.06), transparent 35%),
      radial-gradient(circle at 70% 80%, rgba(255,200,120,0.05), transparent 30%);
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: haze-breathe 8s ease-in-out infinite;
  }

  @keyframes haze-breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .stage-floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 180px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.4));
    pointer-events: none;
    z-index: 2;
  }

  /* 顶部 masthead 在暗底上的特殊处理 */
  .page-masthead {
    border-color: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
  }
  .page-masthead .brand { color: rgba(255,255,255,0.65); }
  .page-masthead .brand::before { box-shadow: 0 0 16px rgba(232,123,58,0.5); }

  .page-footer {
    border-color: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
  }
  .page-footer .section-tag::before { box-shadow: 0 0 10px rgba(232,123,58,0.4); }

  .kicker-light {
    color: var(--accent-light);
    font-family: var(--font-en);
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 40px;
    z-index: 10;
  }

  h1 {
    color: #fff;
    font-size: 142px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 36px;
    z-index: 10;
  }
  h1 .accent {
    color: var(--accent-light);
    text-shadow: 0 0 60px rgba(232,123,58,0.4);
  }

  .subtitle {
    color: rgba(255,255,255,0.72);
    font-size: 40px;
    max-width: 1000px;
    margin-bottom: 80px;
    z-index: 10;
  }

  .meta {
    display: flex;
    gap: 48px;
    font-size: var(--small);
    color: rgba(255,255,255,0.55);
    z-index: 10;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 100px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .meta-item:hover {
    border-color: rgba(232,123,58,0.35);
    background: rgba(232,123,58,0.08);
  }
  .meta-item::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--accent-light);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent-light);
  }

  /* 入场动效 */
  .anim-spotlight {
    opacity: 0;
    animation: spotlightIn 1.4s var(--ease-expo) forwards;
  }
  @keyframes spotlightIn {
    from { opacity: 0; transform: translateX(-50%) scaleY(0.6); }
    to { opacity: 1; transform: translateX(-50%) scaleY(1); }
  }

  .anim-title {
    opacity: 0;
    transform: translateY(40px);
    animation: titleRise 1s var(--ease-expo) 0.4s forwards;
  }
  @keyframes titleRise {
    to { opacity: 1; transform: translateY(0); }
  }

  .anim-subtitle {
    opacity: 0;
    animation: fadeIn 0.8s var(--ease-soft) 0.8s forwards;
  }

  .anim-meta {
    opacity: 0;
    transform: translateY(20px);
    animation: metaUp 0.8s var(--ease-expo) 1.1s forwards;
  }
  @keyframes metaUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .meta-item:nth-child(1) { animation-delay: 1.2s; }
  .meta-item:nth-child(2) { animation-delay: 1.35s; }
  .meta-item:nth-child(3) { animation-delay: 1.5s; }
</style>
</head>
<body>
<div class="slide-content">
  <div class="haze"></div>
  <div class="spotlight anim-spotlight"></div>
  <div class="stage-floor"></div>

  <div class="page-masthead">
    <div class="brand">AI 工具深度应用</div>
    <div>1 / 37 · 开场</div>
  </div>

  <div class="kicker-light anim-fade-up">AI 协作四原则 · V11</div>
  <h1 class="anim-title">从聊天框到<br><span class="accent">数字员工团队</span></h1>
  <p class="subtitle anim-subtitle">AI 工具在产品工作中的深度应用</p>
  <div class="meta">
    <div class="meta-item anim-meta">60 分钟内部分享</div>
    <div class="meta-item anim-meta">面向产品经理</div>
    <div class="meta-item anim-meta">分享 + 实战</div>
  </div>

  <div class="page-footer">
    <div class="section-tag">开场 · 封面</div>
    <div>AI 工具在产品工作中的深度应用</div>
  </div>
</div>
  <script src="../shared/fix-contrast.js"></script>
</body>
</html>
