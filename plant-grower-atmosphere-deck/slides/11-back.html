<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 · 封底</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .back-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    background: var(--paper);
    text-align: center;
  }
  
  .back-ambient {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45, 90, 61, 0.06) 0%, rgba(45, 90, 61, 0) 60%);
    pointer-events: none;
  }
  
  .back-content {
    position: relative;
    z-index: 2;
    max-width: 1000px;
  }
  
  .back-kicker {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 36px;
  }
  
  .back-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 80px;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 32px;
  }
  
  .back-title .accent {
    color: var(--primary);
  }
  
  .back-subtitle {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 28px;
    color: var(--ink-light);
    line-height: 1.5;
    margin-bottom: 48px;
  }
  
  .back-divider {
    width: 100px;
    height: 3px;
    background: var(--accent);
    margin: 0 auto 48px;
  }
  
  .back-points {
    display: flex;
    justify-content: center;
    gap: 48px;
    margin-bottom: 56px;
  }
  
  .back-point {
    text-align: center;
  }
  
  .back-point .number {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 48px;
    color: var(--primary);
    margin-bottom: 8px;
  }
  
  .back-point .label {
    font-size: 14px;
    color: var(--ink-light);
    letter-spacing: 0.02em;
  }
  
  .back-cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 36px;
    background: var(--primary);
    color: white;
    border-radius: 100px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  
  .back-footer {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="back-page">
    <div class="back-ambient"></div>
    
    <div class="back-content">
      <div class="back-kicker">最终结论</div>
      
      <h1 class="back-title">
        先验证，<span class="accent">再放量</span>
      </h1>
      
      <div class="back-subtitle">氛围灯不是全系标配，而是高端/可选 SKU 的验证项；用数据而不是直觉决定。</div>
      
      <div class="back-divider"></div>
      
      <div class="back-points">
        <div class="back-point">
          <div class="number">4</div>
          <div class="label">独立视角</div>
        </div>
        
        <div class="back-point">
          <div class="number">72%</div>
          <div class="label">ROI（待验证）</div>
        </div>
        
        <div class="back-point">
          <div class="number">6</div>
          <div class="label">验证项</div>
        </div>
        
        <div class="back-point">
          <div class="number">0</div>
          <div class="label">全系标配</div>
        </div>
      </div>
      
      <div class="back-cta">
        启动用户研究 + 技术 PoC
      </div>
    </div>
    
    <div class="back-footer">
      植物照射灯氛围灯功能需求分析 · 2026.07.15
    </div>
  </div>
</body>
</html>
